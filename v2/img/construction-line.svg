<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 600" width="1440" height="600"
     fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
     role="img" aria-label="Line drawing of a construction site: a wheel loader, an excavator, a worker with a wheelbarrow, spoil mounds and tower cranes.">

  <!-- Occlusion fill. Inline in a page and it picks up --ground; standalone it
       falls back to the Lognos ground colour. -->
  <style>.knock{ fill:var(--ground,#141414); }</style>

  <!-- ============================================================
       BACKDROP — pines, tower cranes, ridge. Thinnest weight.
       ============================================================ -->
  <g stroke-width="1" opacity="0.32" vector-effect="non-scaling-stroke">
    <path d="M92 372 L92 300 M62 348 L92 286 L122 348 Z M70 320 L92 268 L114 320 Z M76 296 L92 254 L108 296 Z"/>
    <path d="M158 372 L158 316 M136 352 L158 306 L180 352 Z M142 330 L158 290 L174 330 Z"/>
    <path d="M246 372 L246 330 M228 358 L246 322 L264 358 Z M232 340 L246 306 L260 340 Z"/>
    <path d="M1332 372 L1332 302 M1300 350 L1332 288 L1364 350 Z M1308 322 L1332 268 L1356 322 Z"/>
    <path d="M1396 372 L1396 322 M1376 356 L1396 312 L1416 356 Z M1382 334 L1396 296 L1410 334 Z"/>

    <!-- tower crane, left of centre -->
    <g>
      <path d="M486 372 L486 128 M470 372 L470 128 M502 372 L502 128"/>
      <path d="M470 356 L502 332 M502 356 L470 332 M470 320 L502 296 M502 320 L470 296
               M470 284 L502 260 M502 284 L470 260 M470 248 L502 224 M502 248 L470 224
               M470 212 L502 188 M502 212 L470 188 M470 176 L502 152 M502 176 L470 152"/>
      <path d="M456 128 L534 128 M462 116 L520 116 L520 128 M462 116 L462 128"/>
      <path d="M520 112 L714 112 M520 100 L648 100 M520 100 L520 112"/>
      <path d="M648 100 L714 112 M596 100 L596 112 M660 104 L660 112"/>
      <path d="M462 112 L392 112 M462 100 L406 100 L392 112"/>
      <path d="M490 90 L492 62 L660 104 M492 62 L406 100"/>
      <path d="M632 112 L632 196 M622 196 L642 196 L638 212 L626 212 Z"/>
    </g>

    <!-- tower crane, far right -->
    <g opacity="0.72">
      <path d="M1148 372 L1148 196 M1136 372 L1136 196 M1160 372 L1160 196"/>
      <path d="M1136 358 L1160 340 M1160 358 L1136 340 M1136 326 L1160 308 M1160 326 L1136 308
               M1136 294 L1160 276 M1160 294 L1136 276 M1136 262 L1160 244 M1160 262 L1136 244
               M1136 230 L1160 212 M1160 230 L1136 212"/>
      <path d="M1124 196 L1180 196"/>
      <path d="M1172 186 L1300 186 M1172 176 L1262 176 M1262 176 L1300 186 M1172 176 L1172 186"/>
      <path d="M1124 186 L1076 186 M1124 176 L1086 176 L1076 186"/>
      <path d="M1146 166 L1148 146 L1262 176 M1148 146 L1086 176"/>
      <path d="M1248 186 L1248 240 M1241 240 L1255 240 L1252 252 L1244 252 Z"/>
    </g>

    <!-- distant ridge -->
    <path d="M0 372 L118 316 L196 352 L286 302 L372 344 L448 318 L520 356 L612 322
             L700 358 L790 312 L880 350 L966 314 L1058 352 L1140 318 L1226 356 L1320 320 L1440 360"/>
  </g>

  <!-- ============================================================
       SPOIL MOUNDS — placed in the gaps between the machines.
       ============================================================ -->
  <g stroke-width="1.25" opacity="0.4" vector-effect="non-scaling-stroke">
    <path d="M388 470 C428 408 476 394 522 410 C554 422 580 444 602 470"/>
    <path d="M424 456 C454 428 488 422 516 434"/>
    <path d="M816 470 C850 424 888 414 924 428 C942 436 956 452 968 470"/>
    <path d="M846 458 C868 436 896 430 918 440"/>
    <path d="M1206 470 C1248 406 1296 392 1342 408 C1378 420 1408 444 1434 470"/>
    <path d="M1244 454 C1276 426 1310 420 1338 432"/>
  </g>

  <!-- ============================================================
       GROUND — the line everything stands on, plus fissures.
       ============================================================ -->
  <g stroke-width="1.25" opacity="0.5" vector-effect="non-scaling-stroke">
    <path d="M0 470 L1440 470" opacity="0.8"/>
    <path d="M70 512 L128 500 L112 524 L178 514 L160 534 L214 528"/>
    <path d="M1246 502 L1306 492 L1292 512 L1352 504"/>
    <path d="M352 560 L406 550 L392 570"/>
    <path d="M262 486 h22 M300 492 h16 M1180 484 h20 M962 492 h18 M604 486 h20 M860 500 h16"/>
  </g>

  <!-- ============================================================
       WHEEL LOADER — left, facing right. Ground line at y=470.
       ============================================================ -->
  <g transform="translate(64,274)" stroke-width="1.6" vector-effect="non-scaling-stroke" opacity="0.9">
    <path class="knock" d="M20 112 h54 v54 h-54 a8 8 0 0 1 -8 -8 v-38 a8 8 0 0 1 8 -8 z"/>
    <path d="M32 124 v30 M44 124 v30 M56 124 v30" stroke-width="1" opacity="0.65"/>
    <path class="knock" d="M74 110 h98 v56 h-98 z"/>
    <path d="M118 110 v56" stroke-width="1" opacity="0.55"/>
    <!-- cab -->
    <path class="knock" d="M88 46 h74 v64 h-74 z"/>
    <path d="M96 55 h58 v44 h-58 z" stroke-width="1.1"/>
    <path d="M125 55 v44" stroke-width="1" opacity="0.6"/>
    <path d="M82 45 h86" stroke-width="1.2"/>
    <path d="M100 45 v-16 M94 27 h12"/>
    <path d="M78 128 h-12 M78 142 h-12 M78 156 h-12" stroke-width="1" opacity="0.7"/>
    <!-- wheels -->
    <circle class="knock" cx="64" cy="168" r="30"/><circle cx="64" cy="168" r="18" stroke-width="1.1"/><circle cx="64" cy="168" r="6" stroke-width="1"/>
    <circle class="knock" cx="180" cy="168" r="30"/><circle cx="180" cy="168" r="18" stroke-width="1.1"/><circle cx="180" cy="168" r="6" stroke-width="1"/>
    <g stroke-width="1" opacity="0.6">
      <path d="M64 138 v-8 M94 168 h8 M64 198 v8 M34 168 h-8 M85 147 l6 -6 M85 189 l6 6 M43 189 l-6 6 M43 147 l-6 -6"/>
      <path d="M180 138 v-8 M210 168 h8 M180 198 v8 M150 168 h-8 M201 147 l6 -6 M201 189 l6 6 M159 189 l-6 6 M159 147 l-6 -6"/>
    </g>
    <!-- loader arms + bucket -->
    <path class="knock" d="M162 102 L248 132 L248 148 L162 120 Z"/>
    <path d="M156 88 L214 116" stroke-width="1.2"/>
    <path d="M208 112 l14 6" stroke-width="1"/>
    <path class="knock" d="M248 118 L312 116 L326 152 L256 162 Z"/>
    <path d="M256 162 L326 152" stroke-width="1" opacity="0.6"/>
    <g stroke-width="1.1">
      <path d="M272 160 l4 10 M290 158 l4 10 M308 156 l4 10 M322 154 l3 9"/>
    </g>
  </g>

  <!-- ============================================================
       EXCAVATOR — right, facing left, boom raised. Ground at y=470.
       ============================================================ -->
  <g transform="translate(936,224)" stroke-width="1.6" vector-effect="non-scaling-stroke" opacity="0.9">
    <!-- tracks -->
    <path class="knock" d="M36 182 h206 a32 32 0 0 1 0 64 h-206 a32 32 0 0 1 0 -64 z"/>
    <path d="M52 196 h174 a18 18 0 0 1 0 36 h-174 a18 18 0 0 1 0 -36 z" stroke-width="1.1" opacity="0.7"/>
    <circle cx="52" cy="214" r="14" stroke-width="1.1"/>
    <circle cx="226" cy="214" r="14" stroke-width="1.1"/>
    <g stroke-width="1" opacity="0.6">
      <circle cx="100" cy="230" r="7"/><circle cx="139" cy="230" r="7"/><circle cx="178" cy="230" r="7"/>
      <path d="M62 250 v6 M90 252 v6 M118 253 v6 M146 253 v6 M174 252 v6 M202 250 v6"/>
    </g>
    <!-- slew deck, engine, cab -->
    <path class="knock" d="M52 158 h178 l-10 24 h-158 z"/>
    <path class="knock" d="M70 112 h76 v46 h-76 z"/>
    <path d="M82 124 v22 M94 124 v22 M106 124 v22 M118 124 v22" stroke-width="1" opacity="0.6"/>
    <path d="M70 112 l0 -12 h24" stroke-width="1.1" opacity="0.7"/>
    <path class="knock" d="M152 76 h78 v82 h-78 z"/>
    <path d="M161 86 h60 v50 h-60 z" stroke-width="1.1"/>
    <path d="M191 86 v50 M161 144 h60" stroke-width="1" opacity="0.6"/>
    <path d="M146 74 h92" stroke-width="1.2"/>
    <!-- boom -->
    <path class="knock" d="M146 124 L56 38 L78 16 L168 106 Z"/>
    <circle cx="154" cy="116" r="5" stroke-width="1.1"/>
    <path d="M138 110 L80 52" stroke-width="1.2"/>
    <!-- stick -->
    <path class="knock" d="M70 24 L4 102 L28 122 L94 44 Z"/>
    <circle cx="78" cy="28" r="5" stroke-width="1.1"/>
    <path d="M70 46 L36 88" stroke-width="1.2"/>
    <!-- bucket, loaded -->
    <path class="knock" d="M8 96 L-20 116 L-14 152 L36 148 L38 110 Z"/>
    <path d="M8 96 C24 82 38 84 38 110" stroke-width="1.1" opacity="0.7"/>
    <g stroke-width="1.1">
      <path d="M-10 150 l-3 10 M4 149 l-2 10 M18 148 l-1 10 M33 148 l0 10"/>
    </g>
  </g>

  <!-- ============================================================
       WORKER + WHEELBARROW — foreground, centre. Heaviest weight.
       The tray is knocked out so it passes in front of his legs.
       ============================================================ -->
  <g transform="translate(578,344)" stroke-width="1.8" vector-effect="non-scaling-stroke">
    <!-- wheelbarrow, side on, wheel leading -->
    <path class="knock" d="M-30 150 L96 142 L74 184 L0 186 Z"/>
    <path d="M-26 159 L92 151" stroke-width="1.2" opacity="0.6"/>
    <path d="M-22 148 C10 124 60 124 92 142" stroke-width="1.3" opacity="0.75"/>
    <path d="M-30 150 L-44 190" stroke-width="1.4"/>
    <path class="knock" d="M-44 208 m-18 0 a18 18 0 1 0 36 0 a18 18 0 1 0 -36 0"/>
    <circle cx="-44" cy="208" r="6" stroke-width="1.2"/>
    <path d="M62 185 v20 M69 205 h-14" stroke-width="1.4"/>
    <!-- handles -->
    <path d="M96 142 L136 127 M92 153 L147 139" stroke-width="1.5"/>

    <!-- hard hat -->
    <path class="knock" d="M128 32 a22 18 0 0 1 44 0 z"/>
    <path d="M121 32 h58" stroke-width="1.4"/>
    <path d="M150 14 v18" stroke-width="1.1" opacity="0.5"/>
    <!-- head and neck -->
    <path class="knock" d="M136 32 v17 a14 16 0 0 0 28 0 v-17 z"/>
    <path d="M144 50 v10 M156 50 v10" stroke-width="1.2"/>
    <!-- torso, collar, bib -->
    <path class="knock" d="M132 60 h36 v80 h-36 z"/>
    <path d="M134 60 L150 74 L166 60" stroke-width="1.3"/>
    <path d="M139 60 v14 M161 60 v14" stroke-width="1.2"/>
    <path d="M139 80 h22 v22 h-22 z" stroke-width="1.1" opacity="0.6"/>
    <!-- arms down onto the handles -->
    <path d="M132 70 L120 100 L132 125" stroke-width="1.8"/>
    <path d="M168 72 L163 105 L150 137" stroke-width="1.8"/>
    <path d="M128 124 a8 8 0 0 0 10 6" stroke-width="1.4"/>
    <path d="M145 136 a8 8 0 0 0 10 6" stroke-width="1.4"/>
    <!-- legs and boots -->
    <path d="M136 140 v78 M150 140 v78 M164 140 v78"/>
    <path class="knock" d="M128 218 h18 l3 11 h-24 z"/>
    <path class="knock" d="M154 218 h18 l3 11 h-24 z"/>
  </g>
</svg>
